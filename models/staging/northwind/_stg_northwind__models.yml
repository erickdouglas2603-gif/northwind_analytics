version: 2

models:

  - name: stg_northwind__categories
    description: Modelo de staging das categorias de produtos.
    columns:
      - name: pk_categoria
        description: Chave primária da categoria.
        data_tests:
          - unique
          - not_null

      - name: category_name
        description: Nome da categoria.

      - name: description
        description: Descrição da categoria.

      - name: picture
        description: Imagem associada à categoria.

      - name: _rescued_data
        description: Dados que não puderam ser interpretados durante a ingestão.

  - name: stg_northwind__customers
    description: Modelo de staging dos clientes.
    columns:
      - name: pk_customer
        description: Chave primária do cliente.
        data_tests:
          - unique
          - not_null

      - name: company_name
        description: Nome da empresa do cliente.

      - name: contact_name
        description: Nome da pessoa de contato.

      - name: contact_title
        description: Cargo da pessoa de contato.

      - name: address
        description: Endereço do cliente.

      - name: city
        description: Cidade do cliente.

      - name: region
        description: Região do cliente.

      - name: postal_code
        description: Código postal do cliente.

      - name: country
        description: País do cliente.

      - name: phone
        description: Telefone do cliente.

      - name: fax
        description: Fax do cliente.

      - name: _rescued_data
        description: Dados que não puderam ser interpretados durante a ingestão.

  - name: stg_northwind__employee_territories
    description: Modelo de staging da associação entre funcionários e territórios.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - employee_id
              - territory_id

    columns:
      - name: employee_id
        description: Identificador do funcionário.
        data_tests:
          - not_null

      - name: territory_id
        description: Identificador do território.
        data_tests:
          - not_null

      - name: _rescued_data
        description: Dados que não puderam ser interpretados durante a ingestão.

  - name: stg_northwind__employees
    description: Modelo de staging dos funcionários.
    columns:
      - name: pk_employee
        description: Chave primária do funcionário.
        data_tests:
          - unique
          - not_null

      - name: last_name
        description: Sobrenome do funcionário.

      - name: first_name
        description: Primeiro nome do funcionário.

      - name: title
        description: Cargo do funcionário.

      - name: title_of_courtesy
        description: Forma de tratamento do funcionário.

      - name: birth_date
        description: Data de nascimento do funcionário.

      - name: hire_date
        description: Data de contratação do funcionário.

      - name: address
        description: Endereço do funcionário.

      - name: city
        description: Cidade do funcionário.

      - name: region
        description: Região do funcionário.

      - name: postal_code
        description: Código postal do funcionário.

      - name: country
        description: País do funcionário.

      - name: home_phone
        description: Telefone residencial do funcionário.

      - name: extension
        description: Ramal do funcionário.

      - name: photo
        description: Foto do funcionário.

      - name: notes
        description: Observações sobre o funcionário.

      - name: reports_to
        description: Identificador do funcionário responsável pela gestão.

      - name: photo_path
        description: Caminho da foto do funcionário.

      - name: _rescued_data
        description: Dados que não puderam ser interpretados durante a ingestão.

  - name: stg_northwind__order_details
    description: Modelo de staging dos itens dos pedidos.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - product_id

    columns:
      - name: order_id
        description: Identificador do pedido.
        data_tests:
          - not_null

      - name: product_id
        description: Identificador do produto.
        data_tests:
          - not_null

      - name: unit_price
        description: Preço unitário do produto no momento do pedido.

      - name: quantity
        description: Quantidade do produto no pedido.

      - name: discount
        description: Desconto aplicado ao item do pedido.

      - name: _rescued_data
        description: Dados que não puderam ser interpretados durante a ingestão.

  - name: stg_northwind__orders
    description: Modelo de staging dos pedidos realizados pelos clientes.
    columns:
      - name: pk_order
        description: Chave primária do pedido.
        data_tests:
          - unique
          - not_null

      - name: fk_customer
        description: Identificador do cliente que realizou o pedido.

      - name: fk_employee
        description: Identificador do funcionário responsável pelo pedido.

      - name: order_date
        description: Data em que o pedido foi realizado.

      - name: required_date
        description: Data requerida para entrega do pedido.

      - name: shipped_date
        description: Data em que o pedido foi enviado.

      - name: fk_shipper
        description: Identificador da transportadora responsável pelo envio.

      - name: freight
        description: Valor do frete do pedido.

      - name: ship_name
        description: Nome utilizado para o envio.

      - name: ship_address
        description: Endereço de entrega.

      - name: ship_city
        description: Cidade de entrega.

      - name: ship_region
        description: Região de entrega.

      - name: ship_postal_code
        description: Código postal de entrega.

      - name: ship_country
        description: País de entrega.

      - name: _rescued_data
        description: Dados que não puderam ser interpretados durante a ingestão.

  - name: stg_northwind__products
    description: Modelo de staging dos produtos.
    columns:
      - name: pk_product
        description: Chave primária do produto.
        data_tests:
          - unique
          - not_null

      - name: product_name
        description: Nome do produto.

      - name: supplier_id
        description: Identificador do fornecedor.

      - name: category_id
        description: Identificador da categoria.

      - name: quantity_per_unit
        description: Quantidade ou unidade de comercialização do produto.

      - name: unit_price
        description: Preço unitário do produto.

      - name: units_in_stock
        description: Quantidade de unidades em estoque.

      - name: units_on_order
        description: Quantidade de unidades atualmente em pedido.

      - name: reorder_level
        description: Nível de estoque que determina a necessidade de reposição.

      - name: discontinued
        description: Indica se o produto foi descontinuado.

      - name: _rescued_data
        description: Dados que não puderam ser interpretados durante a ingestão.

  - name: stg_northwind__regions
    description: Modelo de staging das regiões.
    columns:
      - name: pk_region
        description: Chave primária da região.
        data_tests:
          - unique
          - not_null

      - name: region_description
        description: Descrição da região.

      - name: _rescued_data
        description: Dados que não puderam ser interpretados durante a ingestão.

  - name: stg_northwind__shippers
    description: Modelo de staging das transportadoras.
    columns:
      - name: pk_shipper
        description: Chave primária da transportadora.
        data_tests:
          - unique
          - not_null

      - name: company_name
        description: Nome da empresa transportadora.

      - name: phone
        description: Telefone da transportadora.

      - name: _rescued_data
        description: Dados que não puderam ser interpretados durante a ingestão.

  - name: stg_northwind__suppliers
    description: Modelo de staging dos fornecedores.
    columns:
      - name: pk_supplier
        description: Chave primária do fornecedor.
        data_tests:
          - unique
          - not_null

      - name: company_name
        description: Nome da empresa fornecedora.

      - name: contact_name
        description: Nome da pessoa de contato.

      - name: contact_title
        description: Cargo da pessoa de contato.

      - name: address
        description: Endereço do fornecedor.

      - name: city
        description: Cidade do fornecedor.

      - name: region
        description: Região do fornecedor.

      - name: postal_code
        description: Código postal do fornecedor.

      - name: country
        description: País do fornecedor.

      - name: phone
        description: Telefone do fornecedor.

      - name: fax
        description: Fax do fornecedor.

      - name: home_page
        description: Página web do fornecedor.

      - name: _rescued_data
        description: Dados que não puderam ser interpretados durante a ingestão.

  - name: stg_northwind__territories
    description: Modelo de staging dos territórios.
    columns:
      - name: pk_territory
        description: Chave primária do território.
        data_tests:
          - unique
          - not_null

      - name: territory_description
        description: Descrição do território.

      - name: region_id
        description: Identificador da região à qual o território pertence.
        data_tests:
          - not_null

      - name: _rescued_data
        description: Dados que não puderam ser interpretados durante a ingestão.